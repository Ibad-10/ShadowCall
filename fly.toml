# Fly.io config. Not deployed. First: fly launch --no-deploy --copy-config, fly volumes create shadowcall_data --size 1,
# fly secrets set DEMO_USER=... DEMO_PASSWORD=...   then fly deploy.
app = "shadowcall"
primary_region = "lhr"

[build]

[env]
  SHADOWCALL_MODE = "replay"
  SHADOWCALL_DB = "/data/shadowcall.db"
  SHADOWCALL_SIGNUP = "false"
  SHADOWCALL_COOKIE_SECURE = "true"
  PORT = "8000"

[[mounts]]
  source = "shadowcall_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
